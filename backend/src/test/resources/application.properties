spring.application.name=carewave-backend-test

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.datasource.url=jdbc:h2:mem:carewave_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=carewave_test_secret_key_32_characters_minimum_length_required_12345
GEMINI_API_KEY=test_gemini_key

spring.mail.host=smtp.gmail.com
spring.mail.port=587

cors.allowed-origins=http://localhost:8081,http://localhost:19006

auth.rate-limit.enabled=true
auth.rate-limit.max-requests=10
auth.rate-limit.window-seconds=60
