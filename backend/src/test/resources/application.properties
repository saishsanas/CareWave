spring.application.name=carewave-backend-test

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.datasource.url=jdbc:h2:mem:carewave_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=CareWaveSecretKeyForJwtTokenGeneration2026SecureKey

resend.api.key=test_resend_api_key
resend.from.email=onboarding@resend.dev
resend.from.name=CareWave
auth.rate-limit.enabled=false
spring.kafka.admin.auto-create=false
